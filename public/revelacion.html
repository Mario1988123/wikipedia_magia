<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>.</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            touch-action: manipulation;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .palabra {
            font-size: clamp(3rem, 15vw, 6rem);
            font-weight: 200;
            letter-spacing: 0.05em;
            text-align: center;
            padding: 20px;
            word-break: break-word;
            max-width: 90%;
            color: transparent;
            transition: color 0.15s ease;
        }

        /* Niveles de visibilidad - muy sutiles */
        .container.active .palabra {
            color: var(--text-color, #080808);
        }

        /* Controles ocultos */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .controls.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #111;
            border: 1px solid #222;
            color: #444;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .control-btn:active {
            background: #222;
        }

        /* Indicador de nivel */
        .level-indicator {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .level-indicator.show {
            opacity: 1;
        }

        .level-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #111;
            transition: background 0.2s;
        }

        .level-dot.active {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="palabra" id="palabra">...</div>
    </div>

    <div class="level-indicator" id="levelIndicator">
        <div class="level-dot" data-level="5"></div>
        <div class="level-dot" data-level="4"></div>
        <div class="level-dot" data-level="3"></div>
        <div class="level-dot" data-level="2"></div>
        <div class="level-dot" data-level="1"></div>
    </div>

    <div class="controls" id="controls">
        <button class="control-btn" onclick="cambiarNivel(-1)">-</button>
        <button class="control-btn" onclick="recargar()">&#8635;</button>
        <button class="control-btn" onclick="cambiarNivel(1)">+</button>
    </div>

    <script>
        const container = document.getElementById('container');
        const palabraEl = document.getElementById('palabra');
        const controls = document.getElementById('controls');
        const levelIndicator = document.getElementById('levelIndicator');

        // Niveles de visibilidad (colores muy oscuros)
        const niveles = ['#050505', '#080808', '#0b0b0b', '#0f0f0f', '#141414'];
        let nivelActual = 1;
        let controlsTimer;
        let palabraActual = '';

        function actualizarNivel() {
            document.body.style.setProperty('--text-color', niveles[nivelActual]);

            // Actualizar indicador
            document.querySelectorAll('.level-dot').forEach((dot, i) => {
                dot.classList.toggle('active', (4 - i) <= nivelActual);
            });
        }

        function cambiarNivel(delta) {
            nivelActual = Math.max(0, Math.min(4, nivelActual + delta));
            actualizarNivel();
            mostrarIndicador();
        }

        function mostrarIndicador() {
            levelIndicator.classList.add('show');
            setTimeout(() => levelIndicator.classList.remove('show'), 1500);
        }

        function recargar() {
            cargarPalabra();
        }

        async function cargarPalabra() {
            try {
                const response = await fetch('/api/ultima-busqueda');
                const data = await response.json();
                if (data.termino && data.termino !== palabraActual) {
                    palabraActual = data.termino;
                    palabraEl.textContent = palabraActual;
                }
            } catch (e) {}
        }

        // Polling
        setInterval(cargarPalabra, 1000);
        cargarPalabra();
        actualizarNivel();

        // Mostrar palabra al mantener presionado
        function activar() {
            container.classList.add('active');
        }

        function desactivar() {
            container.classList.remove('active');
        }

        // Mouse
        container.addEventListener('mousedown', activar);
        container.addEventListener('mouseup', desactivar);
        container.addEventListener('mouseleave', desactivar);

        // Touch
        container.addEventListener('touchstart', (e) => {
            e.preventDefault();
            activar();
        }, { passive: false });

        container.addEventListener('touchend', (e) => {
            e.preventDefault();
            desactivar();
        });

        container.addEventListener('touchcancel', desactivar);

        // Triple tap para mostrar controles
        let tapCount = 0;
        let tapTimer;

        container.addEventListener('click', () => {
            tapCount++;
            clearTimeout(tapTimer);

            if (tapCount === 3) {
                tapCount = 0;
                controls.classList.toggle('visible');

                // Auto-ocultar controles
                clearTimeout(controlsTimer);
                if (controls.classList.contains('visible')) {
                    controlsTimer = setTimeout(() => {
                        controls.classList.remove('visible');
                    }, 5000);
                }
            } else {
                tapTimer = setTimeout(() => tapCount = 0, 400);
            }
        });

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ') {
                e.preventDefault();
                activar();
            }
            if (e.key === 'ArrowUp') cambiarNivel(1);
            if (e.key === 'ArrowDown') cambiarNivel(-1);
            if (e.key === 'f' || e.key === 'F') {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === ' ') desactivar();
        });

        // Prevenir zoom
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        document.addEventListener('dblclick', (e) => e.preventDefault());
    </script>
</body>
</html>
