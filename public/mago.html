<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>M</title>
    <link rel="manifest" href="/api/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23000' width='100' height='100'/></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
        }

        .app {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Header minimalista */
        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff3b30;
        }

        .status-dot.online {
            background: #30d158;
            box-shadow: 0 0 10px #30d158;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .header-btn {
            background: none;
            border: none;
            color: #666;
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .header-btn:active {
            color: #fff;
        }

        /* Área principal de la palabra */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .palabra-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #333;
            margin-bottom: 20px;
        }

        .palabra {
            font-size: clamp(2rem, 12vw, 5rem);
            font-weight: 200;
            text-align: center;
            word-break: break-word;
            max-width: 100%;
            line-height: 1.2;
            min-height: 1.2em;
            transition: all 0.3s ease;
        }

        .palabra.empty {
            color: #222;
        }

        .palabra.new {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .timestamp {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            color: #333;
        }

        /* Historial */
        .historial {
            border-top: 1px solid #1a1a1a;
            max-height: 35%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .historial-header {
            padding: 12px 20px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #444;
            background: #0a0a0a;
            position: sticky;
            top: 0;
        }

        .historial-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #111;
        }

        .historial-item:active {
            background: #111;
        }

        .historial-term {
            color: #0a84ff;
            font-size: 16px;
        }

        .historial-time {
            color: #333;
            font-size: 12px;
        }

        /* Notificación visual */
        .flash {
            animation: flash 0.3s ease-out;
        }

        @keyframes flash {
            0% { background: #0a84ff; }
            100% { background: transparent; }
        }

        /* Modo discreto */
        body.discreto .header,
        body.discreto .historial,
        body.discreto .palabra-label,
        body.discreto .timestamp {
            display: none !important;
        }

        body.discreto .main {
            background: #000;
        }

        body.discreto .palabra {
            font-size: 14px;
            color: #111;
        }

        /* Vibración táctil */
        .vibrate {
            animation: vibrate 0.1s linear;
        }

        @keyframes vibrate {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        /* Modal de instalación PWA */
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1c1c1e;
            border-radius: 12px;
            padding: 15px;
            display: none;
            z-index: 1000;
        }

        .install-prompt.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .install-prompt p {
            font-size: 14px;
            color: #999;
            margin-bottom: 12px;
        }

        .install-prompt .buttons {
            display: flex;
            gap: 10px;
        }

        .install-prompt button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .install-prompt .install-btn {
            background: #0a84ff;
            color: #fff;
        }

        .install-prompt .dismiss-btn {
            background: #2c2c2e;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Conectando...</span>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="toggleDiscreto()" title="Modo discreto">
                    <span id="discretoIcon">&#128065;</span>
                </button>
                <button class="header-btn" onclick="resetear()" title="Limpiar">
                    &#10227;
                </button>
            </div>
        </header>

        <main class="main" id="main">
            <div class="palabra-label">Buscando</div>
            <div class="palabra empty" id="palabra">Esperando...</div>
            <div class="timestamp" id="timestamp"></div>
        </main>

        <section class="historial" id="historial">
            <div class="historial-header">Historial</div>
            <div id="historialList"></div>
        </section>
    </div>

    <div class="install-prompt" id="installPrompt">
        <p>Instala esta app para acceso rápido y discreto</p>
        <div class="buttons">
            <button class="dismiss-btn" onclick="dismissInstall()">Ahora no</button>
            <button class="install-btn" onclick="installPWA()">Instalar</button>
        </div>
    </div>

    <script>
        let ws;
        let modoDiscreto = false;
        let deferredPrompt;

        // Conectar WebSocket
        function conectar() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('online');
                document.getElementById('statusText').textContent = 'Conectado';
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('online');
                document.getElementById('statusText').textContent = 'Reconectando...';
                setTimeout(conectar, 2000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.tipo === 'busqueda') {
                    mostrarPalabra(data.termino, data.timestamp);
                } else if (data.tipo === 'historial') {
                    actualizarHistorial(data.datos);
                }
            };
        }

        function mostrarPalabra(termino, timestamp) {
            const palabraEl = document.getElementById('palabra');
            const mainEl = document.getElementById('main');

            // Animaciones
            mainEl.classList.add('flash');
            palabraEl.classList.remove('new');
            void palabraEl.offsetWidth; // Trigger reflow
            palabraEl.classList.add('new');

            setTimeout(() => mainEl.classList.remove('flash'), 300);

            // Mostrar palabra
            palabraEl.textContent = termino;
            palabraEl.classList.remove('empty');

            // Timestamp
            const fecha = new Date(timestamp);
            document.getElementById('timestamp').textContent = fecha.toLocaleTimeString();

            // Vibración
            if (navigator.vibrate) {
                navigator.vibrate([50, 30, 50]);
            }

            // Sonido sutil (opcional)
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 800;
                gainNode.gain.value = 0.1;
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}

            // Actualizar historial local
            const historialList = document.getElementById('historialList');
            const item = document.createElement('div');
            item.className = 'historial-item';
            item.innerHTML = `
                <span class="historial-term">${termino}</span>
                <span class="historial-time">${fecha.toLocaleTimeString()}</span>
            `;
            historialList.insertBefore(item, historialList.firstChild);
        }

        function actualizarHistorial(datos) {
            const lista = document.getElementById('historialList');
            lista.innerHTML = datos.map(item => {
                const fecha = new Date(item.timestamp);
                return `
                    <div class="historial-item">
                        <span class="historial-term">${item.termino}</span>
                        <span class="historial-time">${fecha.toLocaleTimeString()}</span>
                    </div>
                `;
            }).join('');
        }

        function toggleDiscreto() {
            modoDiscreto = !modoDiscreto;
            document.body.classList.toggle('discreto', modoDiscreto);
            document.getElementById('discretoIcon').textContent = modoDiscreto ? '&#128064;' : '&#128065;';
        }

        function resetear() {
            document.getElementById('palabra').textContent = 'Esperando...';
            document.getElementById('palabra').classList.add('empty');
            document.getElementById('timestamp').textContent = '';
            document.getElementById('historialList').innerHTML = '';

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ tipo: 'reset' }));
            }
        }

        // PWA Install
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            setTimeout(() => {
                document.getElementById('installPrompt').classList.add('show');
            }, 3000);
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById('installPrompt').classList.remove('show');
                });
            }
        }

        function dismissInstall() {
            document.getElementById('installPrompt').classList.remove('show');
        }

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/api/sw.js').catch(() => {});
        }

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') toggleDiscreto();
            if (e.key === 'r' || e.key === 'R') resetear();
            if (e.key === 'Escape') {
                if (modoDiscreto) toggleDiscreto();
            }
        });

        // Doble tap para modo discreto en móvil
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                toggleDiscreto();
            }
            lastTap = now;
        });

        // Iniciar
        conectar();
    </script>
</body>
</html>
