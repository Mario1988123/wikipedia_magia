<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 0.9rem;
            color: #888;
        }

        .palabra-container {
            text-align: center;
            padding: 40px;
            background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
            border-radius: 20px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

        .label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .palabra {
            font-size: 3rem;
            font-weight: 300;
            color: #fff;
            word-break: break-word;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .palabra.empty {
            color: #333;
            font-size: 1.5rem;
        }

        .timestamp {
            font-size: 0.75rem;
            color: #444;
            margin-top: 15px;
        }

        .historial {
            background: #111;
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .historial h3 {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .historial-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #222;
            font-size: 0.9rem;
        }

        .historial-item:last-child {
            border-bottom: none;
        }

        .historial-item .term {
            color: #0af;
        }

        .historial-item .time {
            color: #444;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn {
            background: #222;
            color: #888;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #333;
            color: #fff;
        }

        .btn.primary {
            background: #0066cc;
            color: #fff;
            border-color: #0066cc;
        }

        .btn.primary:hover {
            background: #0077ee;
        }

        /* Modo discreto - pantalla casi invisible */
        .discreto .palabra-container {
            background: transparent;
            border: none;
        }

        .discreto .palabra {
            font-size: 1rem;
            color: #1a1a1a;
        }

        .discreto .label,
        .discreto .timestamp,
        .discreto .historial,
        .discreto .controls,
        .discreto .status {
            display: none;
        }

        /* Notificación sonora visual */
        .flash {
            animation: flashAnim 0.3s ease-out;
        }

        @keyframes flashAnim {
            0% { background: #0066cc; }
            100% { background: transparent; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Conectando...</span>
        </div>

        <div class="palabra-container" id="palabraContainer">
            <div class="label">Última búsqueda</div>
            <div class="palabra empty" id="palabra">Esperando...</div>
            <div class="timestamp" id="timestamp"></div>
        </div>

        <div class="historial" id="historial">
            <h3>Historial</h3>
            <div id="historialList"></div>
        </div>

        <div class="controls">
            <button class="btn" onclick="toggleDiscreto()">Modo Discreto (D)</button>
            <button class="btn" onclick="resetear()">Limpiar (R)</button>
            <button class="btn primary" onclick="abrirRevelacion()">Revelación (V)</button>
        </div>
    </div>

    <script>
        let ws;
        let historial = [];
        let modoDiscreto = false;

        function conectar() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Conectado - Esperando búsquedas...';
            };

            ws.onclose = () => {
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Desconectado - Reconectando...';
                setTimeout(conectar, 2000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.tipo === 'busqueda') {
                    mostrarPalabra(data.termino, data.timestamp);
                }
            };
        }

        function mostrarPalabra(termino, timestamp) {
            const palabraEl = document.getElementById('palabra');
            const timestampEl = document.getElementById('timestamp');
            const container = document.getElementById('palabraContainer');

            // Animación de flash
            container.classList.add('flash');
            setTimeout(() => container.classList.remove('flash'), 300);

            // Mostrar palabra
            palabraEl.textContent = termino;
            palabraEl.classList.remove('empty');

            // Timestamp
            const fecha = new Date(timestamp);
            timestampEl.textContent = fecha.toLocaleTimeString();

            // Agregar al historial
            historial.unshift({ termino, timestamp });
            actualizarHistorial();

            // Sonido de notificación (vibración en móvil)
            if (navigator.vibrate) {
                navigator.vibrate(200);
            }

            // Notificación del navegador
            if (Notification.permission === 'granted') {
                new Notification('Nueva búsqueda', { body: termino });
            }
        }

        function actualizarHistorial() {
            const lista = document.getElementById('historialList');
            lista.innerHTML = historial.slice(0, 10).map(item => {
                const fecha = new Date(item.timestamp);
                return `
                    <div class="historial-item">
                        <span class="term">${item.termino}</span>
                        <span class="time">${fecha.toLocaleTimeString()}</span>
                    </div>
                `;
            }).join('');
        }

        function toggleDiscreto() {
            modoDiscreto = !modoDiscreto;
            document.body.classList.toggle('discreto', modoDiscreto);
        }

        function resetear() {
            document.getElementById('palabra').textContent = 'Esperando...';
            document.getElementById('palabra').classList.add('empty');
            document.getElementById('timestamp').textContent = '';
            historial = [];
            actualizarHistorial();

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ tipo: 'reset' }));
            }
        }

        function abrirRevelacion() {
            window.open('/revelacion', '_blank');
        }

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') toggleDiscreto();
            if (e.key === 'r' || e.key === 'R') resetear();
            if (e.key === 'v' || e.key === 'V') abrirRevelacion();
        });

        // Pedir permiso para notificaciones
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Iniciar conexión
        conectar();
    </script>
</body>
</html>
