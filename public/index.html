<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia, la enciclopedia libre</title>
    <link rel="icon" href="https://www.wikipedia.org/static/favicon/wikipedia.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            min-height: 100vh;
        }

        /* Header estilo Wikipedia */
        .header {
            background: #fff;
            border-bottom: 1px solid #a2a9b1;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #000;
        }

        .logo img {
            height: 50px;
        }

        .logo-text {
            font-size: 1.1rem;
        }

        .logo-text strong {
            font-size: 1.3rem;
        }

        /* Barra de búsqueda */
        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 8px 40px 8px 12px;
            border: 1px solid #a2a9b1;
            border-radius: 2px;
            font-size: 14px;
            background: #fff;
        }

        .search-box:focus {
            outline: none;
            border-color: #36c;
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #36c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 13px;
        }

        .search-btn:hover {
            background: #2a4b8d;
        }

        /* Sugerencias de autocompletado */
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #a2a9b1;
            border-top: none;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .suggestion-item:hover {
            background: #eaf3ff;
        }

        /* Contenido principal */
        .main-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Página de inicio */
        .welcome {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome img {
            width: 200px;
            margin-bottom: 20px;
        }

        .welcome h1 {
            font-size: 2rem;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #54595d;
            margin-bottom: 30px;
        }

        .welcome .search-large {
            max-width: 400px;
            margin: 0 auto;
        }

        .welcome .search-large input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #a2a9b1;
            border-radius: 25px;
            margin-bottom: 15px;
        }

        .welcome .search-large input:focus {
            outline: none;
            border-color: #36c;
        }

        .welcome .search-large button {
            background: #36c;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Artículo */
        .article {
            background: #fff;
            padding: 20px 30px;
            border: 1px solid #a2a9b1;
        }

        .article h1 {
            font-size: 1.8rem;
            font-weight: normal;
            border-bottom: 1px solid #a2a9b1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .article-content {
            line-height: 1.6;
            color: #202122;
        }

        .article-content p {
            margin-bottom: 15px;
        }

        .article-content a {
            color: #36c;
            text-decoration: none;
        }

        .article-content a:hover {
            text-decoration: underline;
        }

        .article-image {
            float: right;
            margin: 0 0 15px 20px;
            max-width: 300px;
            border: 1px solid #a2a9b1;
            padding: 5px;
            background: #f8f9fa;
        }

        .article-image img {
            width: 100%;
        }

        .article-image figcaption {
            font-size: 0.85rem;
            color: #54595d;
            padding: 5px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #54595d;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #36c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: #54595d;
            font-size: 0.85rem;
            border-top: 1px solid #a2a9b1;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/" class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/103px-Wikipedia-logo-v2.svg.png" alt="Wikipedia">
            <span class="logo-text">
                <strong>Wikipedia</strong><br>
                <small>La enciclopedia libre</small>
            </span>
        </a>
        <div class="search-container">
            <input type="text" class="search-box" id="searchHeader" placeholder="Buscar en Wikipedia" autocomplete="off">
            <button class="search-btn" onclick="buscar()">Buscar</button>
            <div class="suggestions" id="suggestionsHeader"></div>
        </div>
    </header>

    <main class="main-content" id="content">
        <div class="welcome">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Wikipedia-logo-v2.svg/200px-Wikipedia-logo-v2.svg.png" alt="Wikipedia">
            <h1>Bienvenidos a Wikipedia</h1>
            <p>La enciclopedia de contenido libre que todos pueden editar</p>
            <div class="search-large">
                <input type="text" id="searchMain" placeholder="Buscar en Wikipedia..." autocomplete="off">
                <button onclick="buscar()">Buscar</button>
            </div>
        </div>
    </main>

    <footer class="footer">
        Wikipedia® es una marca registrada de la Fundación Wikimedia, Inc.
    </footer>

    <script>
        const searchHeader = document.getElementById('searchHeader');
        const searchMain = document.getElementById('searchMain');
        const suggestionsDiv = document.getElementById('suggestionsHeader');
        const content = document.getElementById('content');

        // Sincronizar ambos campos de búsqueda
        searchHeader.addEventListener('input', (e) => {
            if (searchMain) searchMain.value = e.target.value;
            mostrarSugerencias(e.target.value);
        });

        if (searchMain) {
            searchMain.addEventListener('input', (e) => {
                searchHeader.value = e.target.value;
            });

            searchMain.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') buscar();
            });
        }

        searchHeader.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') buscar();
        });

        // Autocompletado desde Wikipedia real
        async function mostrarSugerencias(query) {
            if (query.length < 2) {
                suggestionsDiv.style.display = 'none';
                return;
            }

            try {
                const url = `https://es.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(query)}&limit=8&namespace=0&format=json&origin=*`;
                const response = await fetch(url);
                const data = await response.json();

                if (data[1] && data[1].length > 0) {
                    suggestionsDiv.innerHTML = data[1].map(title =>
                        `<div class="suggestion-item" onclick="seleccionarSugerencia('${title.replace(/'/g, "\\'")}')">${title}</div>`
                    ).join('');
                    suggestionsDiv.style.display = 'block';
                } else {
                    suggestionsDiv.style.display = 'none';
                }
            } catch (e) {
                console.error('Error en sugerencias:', e);
            }
        }

        function seleccionarSugerencia(titulo) {
            searchHeader.value = titulo;
            if (searchMain) searchMain.value = titulo;
            suggestionsDiv.style.display = 'none';
            buscar();
        }

        // Ocultar sugerencias al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                suggestionsDiv.style.display = 'none';
            }
        });

        // FUNCIÓN PRINCIPAL: Buscar y CAPTURAR
        async function buscar() {
            const termino = searchHeader.value.trim();
            if (!termino) return;

            // *** ENVIAR BÚSQUEDA AL MAGO ***
            enviarAlMago(termino);

            // Mostrar loading
            content.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Cargando artículo...</p>
                </div>
            `;

            try {
                // Obtener contenido real de Wikipedia
                const url = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(termino)}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Artículo no encontrado');
                }

                const data = await response.json();
                mostrarArticulo(data);

            } catch (error) {
                // Si no encuentra exactamente, buscar
                buscarArticulos(termino);
            }
        }

        async function buscarArticulos(query) {
            try {
                const url = `https://es.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.query && data.query.search && data.query.search.length > 0) {
                    // Cargar el primer resultado
                    const titulo = data.query.search[0].title;
                    searchHeader.value = titulo;

                    const articleUrl = `https://es.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(titulo)}`;
                    const articleResponse = await fetch(articleUrl);
                    const articleData = await articleResponse.json();
                    mostrarArticulo(articleData);
                } else {
                    content.innerHTML = `
                        <div class="article">
                            <h1>Sin resultados</h1>
                            <p>No se encontraron artículos para "${query}"</p>
                        </div>
                    `;
                }
            } catch (e) {
                content.innerHTML = `
                    <div class="article">
                        <h1>Error</h1>
                        <p>No se pudo cargar el contenido. Intente de nuevo.</p>
                    </div>
                `;
            }
        }

        function mostrarArticulo(data) {
            let imageHtml = '';
            if (data.thumbnail) {
                imageHtml = `
                    <figure class="article-image">
                        <img src="${data.thumbnail.source}" alt="${data.title}">
                        <figcaption>${data.title}</figcaption>
                    </figure>
                `;
            }

            content.innerHTML = `
                <article class="article">
                    <h1>${data.title}</h1>
                    <div class="article-content">
                        ${imageHtml}
                        <p>${data.extract}</p>
                        <p><a href="https://es.wikipedia.org/wiki/${encodeURIComponent(data.title)}" target="_blank">Leer artículo completo en Wikipedia →</a></p>
                    </div>
                </article>
            `;
        }

        // *** FUNCIÓN SECRETA: Enviar al mago ***
        async function enviarAlMago(termino) {
            try {
                await fetch('/api/busqueda', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        termino: termino,
                        timestamp: Date.now()
                    })
                });
            } catch (e) {
                // Silencioso - el espectador no debe saber
            }
        }
    </script>
</body>
</html>
